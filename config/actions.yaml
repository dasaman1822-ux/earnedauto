# Action configuration for earnedauto.
# Reversibility: how easily an action can be undone.
# Blast radius: how much of the system may be affected if the action is wrong.
# Both values are normalized to the range 0.0 to 1.0.

actions:

  restart_service:
    reversibility: 0.9
    blast_radius: 0.1

  requeue_job:
    reversibility: 0.9
    blast_radius: 0.1

  reset_driver:
    reversibility: 0.6
    blast_radius: 0.3

  drain_node:
    reversibility: 0.5
    blast_radius: 0.7

  reclaim_disk:
    reversibility: 0.3
    blast_radius: 0.5

  escalate:
    reversibility: 1.0
    blast_radius: 0.0